  font-size: 12.5px;
  line-height: 1.5;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.concept-workbench-root * {
  box-sizing: border-box;
}

.concept-workbench-root button,
.concept-workbench-root input,
.concept-workbench-root select,
.concept-workbench-root textarea {
  font: inherit;
}

.concept-workbench-root button {
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, transform .12s ease;
}

.concept-workbench-root button:active:not(:disabled) {
  transform: translateY(1px);
}

.concept-workbench-root button:disabled {
  cursor: not-allowed;
  opacity: .42;
}

.concept-workbench-root button:focus-visible,
.concept-workbench-root input:focus-visible,
.concept-workbench-root select:focus-visible,
.concept-workbench-root textarea:focus-visible,
.concept-workbench-root .concept:focus-visible {
  outline: 2px solid var(--sage, #e2e2e2);
  outline-offset: 1px;
}

.concept-workbench-root h1,
.concept-workbench-root h2,
.concept-workbench-root h3,
.concept-workbench-root p {
  margin: 0;
}

/* Main Viewport Container: Fixed Height, No Page-Level Scroll */
.concept-workbench-root .main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 12px 20px 8px;
  margin: 0 auto;
  width: 100%;
  max-width: 1920px;
  overflow: hidden;
}

/* Compact Top Header */
.concept-workbench-root .top-strip {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid #2e2e2e;
}

.concept-workbench-root .title-group {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.concept-workbench-root .title-group h1 {
  font-size: 16px;
  font-weight: 750;
  color: #f9f9f9;
  letter-spacing: -.3px;
  white-space: nowrap;
}

.concept-workbench-root .title-group .subtitle {
  font-size: 11px;
  color: #8f8f8f;
  white-space: nowrap;
}

.concept-workbench-root .compact-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* Notice Bar: Slim single-line dismissible ribbon */
.concept-workbench-root .slim-notice {
  flex: 0 0 auto;
  background: #222222;
  border: 1px solid #343434;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 11px;
  color: #a4a4a4;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 9px;
  line-height: 1.4;
}

.concept-workbench-root .slim-notice .notice-text {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.concept-workbench-root .slim-notice .notice-icon {
  color: var(--sage, #e2e2e2);
  font-size: 13px;
  flex: 0 0 auto;
}

.concept-workbench-root .slim-notice strong {
  color: #f8f8f8;
}

/* Three-Column Workspace Grid: Strictly Fills Remaining Viewport */
.concept-workbench-root .workgrid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 280px minmax(380px, 1fr) 340px;
  gap: 12px;
  align-items: stretch;
  overflow: hidden;
}

/* Common Panel Container */
.concept-workbench-root .panel {
  background: var(--surface, #242424);
  border: 1px solid var(--stroke, #383838);
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(12, 12, 12, 0.35);
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Panel Header */
.concept-workbench-root .panelhead {
  flex: 0 0 auto;
  padding: 10px 14px;
  border-bottom: 1px solid #2f2f2f;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: #232323;
}

.concept-workbench-root .panelhead h2 {
  font-size: 13px;
  font-weight: 730;
  color: #f9f9f9;
}

.concept-workbench-root .panelhead .overline {
  font-size: 9.5px;
  letter-spacing: .8px;
  color: #8f8f8f;
  font-weight: 650;
}

/* Left Column: Conditions */
.concept-workbench-root .conditions {
  height: 100%;
}

.concept-workbench-root .conditions-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px 13px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
}
.concept-workbench-root .conditions-scroll::-webkit-scrollbar {
  width: 5px;
}
.concept-workbench-root .conditions-scroll::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 4px;
}
.concept-workbench-root .conditions-scroll::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.35);
}
.concept-workbench-root .conditions-scroll::-webkit-scrollbar-track {
  background: transparent;
}

.concept-workbench-root .conditions-foot {
  flex: 0 0 auto;
  padding: 10px 13px;
  border-top: 1px solid #323232;
  background: #1d1d1d;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 -4px 12px rgba(12, 12, 12, 0.25);
}

/* Accordion Folders inside Conditions */
.concept-workbench-root .accordion {
  border: 1px solid #303030;
  border-radius: 8px;
  background: #1c1c1c;
  margin-top: 8px;
  overflow: hidden;
}

.concept-workbench-root .accordion summary {
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 650;
  color: #bcbcbc;
  cursor: pointer;
  user-select: none;
  background: #242424;
  transition: background .15s, color .15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.concept-workbench-root .accordion summary:hover {
  background: #2b2b2b;
  color: #f9f9f9;
}

.concept-workbench-root .accordion-body {
  padding: 10px 10px 8px;
  border-top: 1px solid #2d2d2d;
  background: #1a1a1a;
}

/* Common form elements */
.concept-workbench-root .group {
  padding: 8px 0;
  border-bottom: 1px solid #2c2c2c;
}

.concept-workbench-root .group:last-child {
  padding-bottom: 0;
  border-bottom: 0;
}

.concept-workbench-root .grouphead {
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 6px;
  color: #e7e7e7;
}

.concept-workbench-root .grouphead span:last-child {
  font-size: 9.5px;
  font-weight: 500;
  color: #8f8f8f;
}

.concept-workbench-root .chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.concept-workbench-root .chip {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  max-width: 100%;
  border-radius: 5px;
  background: #2e2e2e;
  color: #bfbfbf;
  padding: 3px 7px;
  font-size: 10px;
  line-height: 1.3;
  border: 1px solid #383838;
  overflow-wrap: anywhere;
}

.concept-workbench-root .chip.fixed {
  background: rgba(237, 237, 237, 0.14);
  color: #ededed;
  border-color: rgba(237, 237, 237, 0.3);
}

.concept-workbench-root .chip.excluded {
  background: rgba(204, 204, 204, 0.14);
  color: #cccccc;
  border-color: rgba(204, 204, 204, 0.3);
}

.concept-workbench-root .chip.new {
  background: rgba(226, 226, 226, 0.16);
  color: #e2e2e2;
  border-color: rgba(226, 226, 226, 0.3);
}

.concept-workbench-root .chip .x {
  border: 0;
  background: transparent;
  color: inherit;
  opacity: .75;
  padding: 0;
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
}

.concept-workbench-root .chip .x:hover {
  opacity: 1;
}

.concept-workbench-root .inputrow {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 6px;
}

.concept-workbench-root .field,
#conceptOverlay .field {
  width: 100%;
  min-width: 0;
  background: #1b1b1b;
  border: 1px solid #383838;
  border-radius: 7px;
  color: #f9f9f9;
  padding: 6px 8px;
  font-size: 11px;
  line-height: 1.4;
  transition: border-color .15s ease, outline .15s ease;
}

.concept-workbench-root .field:focus,
#conceptOverlay .field:focus {
  outline: 2px solid rgba(226, 226, 226, 0.35);
  border-color: var(--sage, #e2e2e2);
}

.concept-workbench-root .textarea,
#conceptOverlay .textarea {
  min-height: 75px;
  resize: vertical;
  line-height: 1.6;
}

.concept-workbench-root .button,
#conceptOverlay .button {
  background: #2e2e2e;
  border: 1px solid #383838;
  color: #f9f9f9;
  padding: 6px 10px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 650;
  white-space: nowrap;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  line-height: 1.35;
  vertical-align: middle;
  cursor: pointer;
  transition: all .15s ease;
}
.concept-workbench-root .button svg,
#conceptOverlay .button svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  vertical-align: middle;
}

.concept-workbench-root .button:hover:not(:disabled),
#conceptOverlay .button:hover:not(:disabled) {
  background: #353535;
  border-color: #484848;
  color: #f9f9f9;
}

.concept-workbench-root .button.primary,
#conceptOverlay .button.primary {
  background: var(--sage, #e2e2e2);
  border-color: var(--sage, #e2e2e2);
  color: #191919;
  font-weight: 750;
}

.concept-workbench-root .button.primary:hover:not(:disabled),
#conceptOverlay .button.primary:hover:not(:disabled) {
  filter: brightness(1.1);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(226, 226, 226, 0.28);
}

.concept-workbench-root .button.small,
#conceptOverlay .button.small {
  padding: 4px 7px;
  font-size: 10.5px;
}

.concept-workbench-root .button.icon,
#conceptOverlay .button.icon {
  width: 27px;
  height: 27px;
  padding: 0;
  font-size: 13px;
}

.concept-workbench-root .button.active,
#conceptOverlay .button.active {
  background: rgba(226, 226, 226, 0.18);
  color: var(--sage, #e2e2e2);
  border-color: var(--sage, #e2e2e2);
}

.concept-workbench-root .button.fill,
#conceptOverlay .button.fill {
  width: 100%;
}

.concept-workbench-root .quick-presets {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}

.concept-workbench-root .preset {
  border: 1px solid #343434;
  background: #272727;
  border-radius: 6px;
  padding: 4px 7px;
  color: #bfbfbf;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
}

.concept-workbench-root .preset:hover {
  background: #2f2f2f;
  border-color: #454545;
  color: #f9f9f9;
}

.concept-workbench-root .preset.active {
  background: rgba(226, 226, 226, 0.16);
  color: var(--sage, #e2e2e2);
  border-color: var(--sage, #e2e2e2);
}

.concept-workbench-root .direction-field {
  min-height: 64px;
  max-height: 140px;
  font-size: 11px;
}

.concept-workbench-root .focus-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 6px 0 4px;
}

.concept-workbench-root .focus-name {
  font-size: 10px;
  color: var(--sage, #e2e2e2);
  font-weight: 700;
  max-width: 65%;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.concept-workbench-root .numrow {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}

.concept-workbench-root .numrow .button {
  padding: 5px 2px;
  font-size: 10px;
}

.concept-workbench-root .seed-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.concept-workbench-root .seed-row .field {
  padding: 5px 7px;
  font-size: 10.5px;
}

.concept-workbench-root .range {
  accent-color: var(--sage, #e2e2e2);
  width: 100%;
}

.concept-workbench-root .error {
  font-size: 10px;
  color: var(--danger, #cccccc);
  min-height: 0;
}

/* Middle Column: Results & Candidates */
.concept-workbench-root .results {
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.concept-workbench-root .results-top-bar {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
  flex-wrap: wrap;
}

.concept-workbench-root .resultstitle {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.concept-workbench-root .resultstitle h2 {
  font-size: 14px;
  font-weight: 730;
}

.concept-workbench-root .resultstitle span {
  font-size: 10.5px;
  color: #8f8f8f;
}

.concept-workbench-root .resultstools {
  display: flex;
  align-items: center;
  gap: 5px;
}

.concept-workbench-root .view-toggle {
  display: flex;
  background: #1b1b1b;
  border: 1px solid #363636;
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}

.concept-workbench-root .view-toggle button {
  border: 0;
  background: transparent;
  color: #8f8f8f;
  font-size: 10.5px;
  padding: 3px 7px;
  border-radius: 4px;
}

.concept-workbench-root .view-toggle button.active {
  background: #2f2f2f;
  color: var(--sage, #e2e2e2);
  font-weight: 700;
}

.concept-workbench-root .directionbar {
  flex: 0 0 auto;
  border: 1px solid #2f2f2f;
  background: #1c1c1c;
  border-radius: 8px;
  padding: 6px 10px;
  margin-bottom: 8px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.concept-workbench-root .directionbar .directionlabel {
  font-size: 10px;
  color: #8f8f8f;
  font-weight: 700;
}

.concept-workbench-root .branch-pill {
  max-width: 150px;
  padding: 3px 8px;
  border: 1px solid #373737;
  background: #2a2a2a;
  border-radius: 6px;
  color: #bfbfbf;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}

.concept-workbench-root .branch-pill.active {
  background: rgba(226, 226, 226, 0.18);
  border-color: var(--sage, #e2e2e2);
  color: var(--sage, #e2e2e2);
  font-weight: 750;
}

/* Scroll Container for Results */
.concept-workbench-root .results-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-right: 2px;
}

/* Card Mode */
.concept-workbench-root .resultgrid.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  align-items: stretch;
}

.concept-workbench-root .concept {
  min-width: 0;
  background: var(--surface, #242424);
  border: 1px solid #353535;
  border-radius: 11px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .12s;
  box-shadow: 0 3px 12px rgba(12, 12, 12, 0.3);
}

.concept-workbench-root .concept:hover {
  border-color: #4c4c4c;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(12, 12, 12, 0.45);
}

.concept-workbench-root .concept.selected {
  border-color: var(--sage, #e2e2e2);
  box-shadow: 0 0 0 1px var(--sage, #e2e2e2), 0 6px 20px rgba(12, 12, 12, 0.5);
}

.concept-workbench-root .concept-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px 2px;
  gap: 6px;
}

.concept-workbench-root .concept-id {
  font-size: 9.5px;
  font-weight: 720;
  color: #8f8f8f;
  letter-spacing: .8px;
}

.concept-workbench-root .tiny-state {
  font-size: 9.5px;
  color: #dcdcdc;
  background: rgba(220, 220, 220, 0.16);
  padding: 2px 7px;
  border-radius: 20px;
  white-space: nowrap;
  font-weight: 600;
}

.concept-workbench-root .tiny-state.plain {
  background: #2e2e2e;
  color: #a2a2a2;
}

.concept-workbench-root .tiny-state.new {
  background: rgba(226, 226, 226, 0.18);
  color: #e2e2e2;
}

.concept-workbench-root .concept-content {
  padding: 5px 12px 10px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.concept-workbench-root .concept h3 {
  font-size: 13.5px;
  line-height: 1.4;
  font-weight: 750;
  overflow-wrap: anywhere;
  color: #f9f9f9;
  min-height: 36px;
}

.concept-workbench-root .teaser {
  font-size: 11px;
  line-height: 1.65;
  color: #bbbbbb;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 72px;
}

.concept-workbench-root .source-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.concept-workbench-root .source-tags .chip {
  font-size: 9.5px;
  padding: 2px 6px;
}

.concept-workbench-root .conceptfoot {
  border-top: 1px solid #2d2d2d;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  background: #1d1d1d;
}

.concept-workbench-root .source-note {
  font-size: 9.5px;
  color: #8f8f8f;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Compact List View Mode (Direction 4: Instant High-Density Scanning) */
.concept-workbench-root .resultgrid.compact {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.concept-workbench-root .compact-item {
  background: #232323;
  border: 1px solid #323232;
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all .14s ease;
}

.concept-workbench-root .compact-item:hover {
  background: #2a2a2a;
  border-color: #454545;
}

.concept-workbench-root .compact-item.selected {
  border-color: var(--sage, #e2e2e2);
  background: #282828;
  box-shadow: 0 0 0 1px var(--sage, #e2e2e2);
}

.concept-workbench-root .compact-left {
  flex: 0 0 auto;
  font-size: 9.5px;
  font-weight: 700;
  color: #8f8f8f;
  letter-spacing: .5px;
}

.concept-workbench-root .compact-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.concept-workbench-root .compact-title {
  font-size: 12.5px;
  font-weight: 700;
  color: #f9f9f9;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.concept-workbench-root .compact-tags {
  display: flex;
  gap: 4px;
  align-items: center;
  overflow: hidden;
  white-space: nowrap;
}

.concept-workbench-root .compact-tags .chip {
  font-size: 9px;
  padding: 1px 5px;
}

.concept-workbench-root .compact-actions {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Right Column: Editor with Tabs & Sticky Footer (Directions 1 & 2) */
.concept-workbench-root .editor {
  height: 100%;
}

.concept-workbench-root .editor-tabs {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  padding: 6px 10px;
  background: #1b1b1b;
  border-bottom: 1px solid #2f2f2f;
  gap: 4px;
}

.concept-workbench-root .editor-tab-btn {
  border: 0;
  background: transparent;
  color: #8f8f8f;
  font-size: 10.5px;
  font-weight: 650;
  padding: 6px 4px;
  border-radius: 6px;
  text-align: center;
  cursor: pointer;
  transition: all .14s ease;
}

.concept-workbench-root .editor-tab-btn:hover {
  background: #2b2b2b;
  color: #efefef;
}

.concept-workbench-root .editor-tab-btn.active {
  background: #2e2e2e;
  color: var(--sage, #e2e2e2);
  font-weight: 750;
  box-shadow: 0 1px 4px rgba(12, 12, 12, 0.3);
}

.concept-workbench-root .editor-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 14px;
}

.concept-workbench-root .editor-foot {
  flex: 0 0 auto;
  padding: 10px 14px;
  border-top: 1px solid #323232;
  background: #1d1d1d;
  display: flex;

/* 2. Custom Checkbox & Range Slider */
input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 15px;
  height: 15px;
  background: #232323;
  border: 1px solid #404040;
  border-radius: 4px;
  cursor: pointer;
  position: relative;
  vertical-align: middle;
  transition: all .15s ease;
  display: inline-block;
}

input[type="checkbox"]:hover {
  border-color: var(--sage, #e2e2e2);
}

input[type="checkbox"]:checked {
  background: var(--sage, #e2e2e2);
  border-color: var(--sage, #e2e2e2);
}

input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 4px;
  top: 1px;
  width: 4px;
  height: 8px;
  border: solid #191919;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

input[type="range"].range {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 5px;
  background: #2d2d2d;
  border-radius: 3px;
  outline: none;
  margin: 6px 0;
}

input[type="range"].range::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--sage, #e2e2e2);
  cursor: pointer;
  border: 2px solid #1c1c1c;
  box-shadow: 0 0 6px rgba(226, 226, 226, 0.5);
  transition: transform .12s ease;
}

input[type="range"].range::-webkit-slider-thumb:hover {
  transform: scale(1.18);
}

/* =========================================================
   Area 2 & 3: Real CSS Variable Bindings & Status Popover
   ========================================================= */
:root {
  --radius: 8px;
  --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --reading-font-size: 15px;
  --ui-accent: #ac97f5;
  --ui-action-bg: #7446C8;
}

:root[data-st-accent="neutral"] {
  --ui-accent: #9e9e9e;
  --ui-action-bg: #4a4a4a;
}

body, button, input, select, textarea {
  font-family: var(--font-main);
}

.btn, .button, .input, .select, .textarea, .card, .settings-card, .chip, .badge,
.ext-card, .theme-swatch-item, .topbar-status-btn, .dialog {
  border-radius: var(--radius);
}

/* UI Density */
:root[data-st-density="compact"] {
  font-size: 12.5px;
}
:root[data-st-density="compact"] .btn,
:root[data-st-density="compact"] .button {
  padding: 4px 9px;
  font-size: 12px;
}
:root[data-st-density="compact"] .settings-card {
  padding: 12px 14px;
  margin-bottom: 12px;
}
:root[data-st-density="spacious"] {
  font-size: 14px;
}
:root[data-st-density="spacious"] .settings-card {
  padding: 20px 22px;
  margin-bottom: 20px;
}

/* Reduced Motion */
:root[data-st-reduced-motion="true"] *,
:root[data-st-reduced-motion="true"] *::before,
:root[data-st-reduced-motion="true"] *::after {
  animation-duration: 0.001ms !important;
  transition-duration: 0.001ms !important;
}

/* Reading font size in readers */
.reader-content, .reading-text, .chapter-content, .preview-reading-sample {
  font-size: var(--reading-font-size, 15px) !important;
}

/* Topbar Status Button */
.topbar-status-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #1e1e1e;
  border: 1px solid #363636;
  padding: 5px 10px;
  font-size: 11.5px;
  font-weight: 500;

  height: 6.5px;
  border-radius: 50%;
  background: #789c82; /* Sage ready dot */

/* Global Status Popover */
.global-status-popover {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 330px;
  background: #1c1c1c;
  border: 1px solid #3a3a3a;
  box-shadow: 0 14px 40px rgba(0,0,0,0.65);
  border-radius: 8px;

  padding: 14px 16px;

}
.global-status-popover.open {

  flex-direction: column;
  gap: 10px;
}
.status-pop-head {
  display: flex;
  align-items: center;

.status-pop-list {

  flex-direction: column;

}
.status-pop-item {

.status-pop-dot {

.status-pop-info {

  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
}
.conn-toggle-wrap input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.conn-toggle-track {
  width: 28px;
  height: 16px;
  background: #2e2e33;
  border-radius: 9px;
  position: relative;
  transition: background 0.15s ease;
  flex-shrink: 0;
}
.conn-toggle-thumb {
  width: 12px;
  height: 12px;
  background: #d4d4d8;
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: transform 0.15s ease, background 0.15s ease;
}
.conn-toggle-wrap input:checked + .conn-toggle-track {
  background: var(--ui-accent, #ac97f5);
}
.conn-toggle-wrap input:checked + .conn-toggle-track .conn-toggle-thumb {
  transform: translateX(12px);
  background: #ffffff;
}
.conn-toggle-text {
  font-size: 11px;
  color: #71717a;
  font-weight: 500;
  transition: color 0.15s ease;
}
.conn-toggle-wrap input:checked ~ .conn-toggle-text {
  color: #d4d4d8;
}

  background: #1c1c1c;
  border-right: 1px solid #303030;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.v3-picker-sidebar-head {
  padding: 12px 14px 10px;
  border-bottom: 1px solid #2a2a2a;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.v3-picker-sidebar-head h4 {
  font-size: 11px;
  font-weight: 700;
  color: #8c8c8c;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 0;
}

.v3-picker-cat-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.v3-picker-cat-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 7px 10px;
  border-radius: 7px;
  border: 1px solid transparent;
  background: transparent;
  color: #bfbfbf;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all .14s ease;
}

.v3-picker-cat-btn:hover {
  background: #262626;
  color: #f0f0f0;
}

.v3-picker-cat-btn.active {
  background: rgba(226, 226, 226, 0.12);
  border-color: rgba(226, 226, 226, 0.32);
  color: #f5f5f5;
  font-weight: 700;
}

.v3-picker-cat-badges {
  display: flex;
  align-items: center;
  gap: 4px;
}

.v3-picker-cat-badge {
  background: #2a2a2a;
  color: #a8a8a8;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 600;
}

.v3-picker-cat-btn.active .v3-picker-cat-badge {
  background: rgba(226, 226, 226, 0.2);
  color: #f5f5f5;
}

.v3-picker-mini-indicator {
  font-size: 9.5px;
  padding: 1px 4px;
  border-radius: 4px;
  font-weight: 700;
}
.v3-picker-mini-indicator.fixed {
  background: rgba(80, 160, 100, 0.16);
  color: #9ec7a3;
  border: 1px solid #354838;
}
.v3-picker-mini-indicator.excluded {
  background: rgba(200, 80, 80, 0.16);
  color: #c89f9f;
  border: 1px solid #4a3336;
}

/* Right Main Panel */
.v3-picker-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #171717;
  overflow: hidden;
}

/* Top Toolbar */
.v3-picker-topbar {
  padding: 12px 18px 10px;
  background: #1e1e1e;
  border-bottom: 1px solid #2e2e2e;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.v3-picker-filter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.v3-picker-search-wrap {
  position: relative;
  flex: 1;
  min-width: 220px;
  max-width: 420px;
  display: flex;
  align-items: center;
}

.v3-picker-search-icon {
  position: absolute;
  left: 9px;
  color: #7a7a7a;
  font-size: 12px;
  pointer-events: none;
}

.v3-picker-search-input {
  width: 100%;
  background: #141414;
  border: 1px solid #383838;
  border-radius: 7px;
  color: #f5f5f5;
  font-size: 12px;
  padding: 6px 28px 6px 28px;
  outline: none;
  transition: all .15s ease;
}

.v3-picker-search-input:focus {
  border-color: #727272;
  box-shadow: 0 0 6px rgba(226, 226, 226, 0.2);
}

.v3-picker-search-clear {
  position: absolute;
  right: 7px;
  background: transparent;
  border: none;
  color: #888888;
  cursor: pointer;
  padding: 2px 4px;
  font-size: 11px;
}
.v3-picker-search-clear:hover {
  color: #ffffff;
}

.v3-picker-status-filters {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.v3-picker-filter-btn {
  background: #252525;
  border: 1px solid #363636;
  color: #b5b5b5;
  font-size: 11px;
  font-weight: 600;
  padding: 5px 9px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .14s ease;
  display: flex;
  align-items: center;
  gap: 5px;
}

.v3-picker-filter-btn:hover {
  background: #2e2e2e;
  color: #f0f0f0;
}

.v3-picker-filter-btn.active {
  background: rgba(226, 226, 226, 0.14);
  border-color: rgba(226, 226, 226, 0.38);
  color: #ffffff;
}

.v3-picker-subbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  color: #888888;
  flex-wrap: wrap;
}

.v3-picker-subbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.v3-picker-subbar-btn {
  background: #252525;
  border: 1px solid #333333;
  color: #adadad;
  font-size: 10.5px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 5px;
  cursor: pointer;
  transition: all .12s ease;
}

.v3-picker-subbar-btn:hover {
  background: #2f2f2f;
  color: #ffffff;
  border-color: #484848;
}

/* Tag Matrix Grid */
.v3-picker-matrix {
  flex: 1;
  overflow-y: auto;
  padding: 14px 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.v3-picker-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px;
}

/* Tag Card */
.v3-picker-card {
  background: #202020;
  border: 1px solid #343434;
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 6px;
  cursor: pointer;
  transition: all .14s ease;
  user-select: none;
  min-height: 52px;
}

.v3-picker-card:hover {
  background: #262626;
  border-color: #4c4c4c;
}

.v3-picker-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
}

.v3-picker-card-name {
  font-size: 12px;
  font-weight: 650;
  color: #e5e5e5;
  line-height: 1.3;
  word-break: break-all;
}

.v3-picker-card-cat {
  font-size: 10px;
  color: #7b7b7b;
  margin-top: 1px;
}

.v3-picker-card-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

.v3-picker-opt-btn {
  background: #2b2b2b;
  border: 1px solid #3d3d3d;
  color: #9c9c9c;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  cursor: pointer;
  transition: all .12s ease;
}

.v3-picker-opt-btn:hover {
  background: #363636;
  color: #ffffff;
}

/* Fixed state (必须保留) - Muted Sage Green */
.v3-picker-card.is-fixed {
  background: rgba(100, 170, 115, 0.09) !important;
  border-color: #354838 !important;
}

.v3-picker-card.is-fixed .v3-picker-card-name {
  color: #9ec7a3 !important;
  font-weight: 700;
}

.v3-picker-card.is-fixed .v3-picker-opt-btn.opt-fixed {
  background: #2b3e2e !important;
  border-color: #3e5842 !important;
  color: #bde0c1 !important;
  font-weight: 650;
}

/* Excluded state (本轮排除) - Muted Dusty Rose (Figure 3) */
.v3-picker-card.is-excluded {
  background: rgba(220, 100, 100, 0.09) !important;
  border-color: #4a3336 !important;
}

.v3-picker-card.is-excluded .v3-picker-card-name {
  color: #c89f9f !important;
  text-decoration: line-through;
}

.v3-picker-card.is-excluded .v3-picker-opt-btn.opt-excluded {
  background: #4a2d30 !important;
  border-color: #633e42 !important;
  color: #e5b8b8 !important;
  font-weight: 650;
}

/* Quick Add Notice in matrix */
.v3-picker-add-banner {
  background: #222222;
  border: 1px dashed #444444;
  border-radius: 8px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  color: #c5c5c5;
}

.v3-picker-add-banner-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}


/* ============================================================
   CODEX NATIVE DARK • Visual-only unification
   Neutral surfaces, legible content, quiet controls.
   All application logic and workspace layouts remain intact.
   ============================================================ */
:root {
  color-scheme: dark;
  --bg:#171717; --rail:#1d1d1d; --surface:#202020;
  --panel:#242424; --panel2:#292929; --hover:#303030;
  --stroke:#343434; --stroke2:#444444;
  --ink:#eeeeee; --muted:#b4b4b4; --dim:#8f8f8f;
  --sage:#e9e9e9; --sage-d:#2f2f2f;
  --blue:#d3d3d3; --blue-d:#343434;
  --gold:#c4c4c4; --pink:#bdbdbd; --danger:#e7a4a4;
  --faint:#898989; --custom-menu:#252525;
  --custom-hover:#333333; --custom-line:#494949;
  --v23line:#383838; --v23soft:#242424;
}
html,body { background:var(--bg); color:var(--ink); }
body{ -webkit-font-smoothing:antialiased; }
*{scrollbar-color:#464646 transparent;}
*::-webkit-scrollbar-thumb{background:#4b4b4b;border-color:transparent;}
*::-webkit-scrollbar-thumb:hover{background:#666666;}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,
[role="button"]:focus-visible {outline:2px solid #c1c1c1!important;outline-offset:2px;}
/* Structural depth is created by two quiet surfaces and fine 1px dividers. */
.rail,.topbar,.sidebar,.tag-cats,.v3-tag-cats,.v23-index-cats {background:#1d1d1d!important;border-color:#343434!important;}
.context,.tag-edit,.v3-tag-inspector,.v23-index-detail {background:#1c1c1c!important;border-color:#343434!important;}
.page,.center,.v3-tag-list-main,.tag-list,.v23-index-list {background:#171717!important;}
.nav-button,.side-link,.side-session {transition:background-color .13s,border-color .13s,color .13s;}
.nav-button:hover,.side-link:hover,.side-session:hover {background:#292929!important;color:#f1f1f1!important;}
.nav-button.on,.side-link.on,.side-session.on,.tab.on,.v3-tag-cats .side-link.on,
.v23-roleview button.on,.v22-segment button.on,.v25-segment button.on,
.v3-tag-toolbar .view-toggle button.active,.v3-rp-toolbar .view-toggle button.active,
.concept-workbench-root .editor-tab-btn.active,
.concept-workbench-root .view-toggle button.active {
  background:#303030!important;color:#f0f0f0!important;border-color:#414141!important;
}
/* A single source of truth for ALL primary actions, across every workspace.
   The accent picker provides a contrast-safe action colour and white foreground.
   Neutral navigation states and secondary buttons are kept independent. */
.btn.primary,.button.primary,.v3-btn-primary,.concept-workbench-root .button.primary,
#conceptOverlay .button.primary,.v3-rp-send-btn,.v3-tag-batch-bar .primary,
.v3-zen-paper-foot .primary {
  background:var(--ui-action-bg,#555555)!important;
  background-color:var(--ui-action-bg,#555555)!important;
  color:#ffffff!important;
  border:1px solid var(--ui-action-bg,#555555)!important;
  box-shadow:none!important;
  font-weight:670;
}
.btn.primary:hover,.button.primary:hover,.v3-btn-primary:hover,.concept-workbench-root .button.primary:hover,
#conceptOverlay .button.primary:hover,.v3-rp-send-btn:hover,
.v3-tag-batch-bar .primary:hover,.v3-zen-paper-foot .primary:hover {
  background:color-mix(in srgb,var(--ui-action-bg,#555555) 88%,#000000)!important;
  background-color:color-mix(in srgb,var(--ui-action-bg,#555555) 88%,#000000)!important;
  color:#ffffff!important;
  border-color:var(--ui-action-bg,#555555)!important;
  box-shadow:none!important;
  filter:none!important;
  transform:none!important;
}
.btn.primary svg,.button.primary svg,.v3-btn-primary svg,.concept-workbench-root .button.primary svg,
#conceptOverlay .button.primary svg,.v3-rp-send-btn svg{
  color:#ffffff!important;
  stroke:currentColor!important;
}
/* Secondary actions stay dark and never compete with the primary CTA. */
.btn:not(.primary),.v3-btn-sage,.concept-workbench-root .button:not(.primary),
#conceptOverlay .button:not(.primary),.v3-shelf-btn,.v3-wt-step,
.select-trigger,.pill-button,.btn-spark-action {
  box-shadow:none!important;
}
.btn:not(.primary):not(.quiet),.v3-btn-sage,
.concept-workbench-root .button:not(.primary):not(.active),
#conceptOverlay .button:not(.primary):not(.active) {
  background:#292929!important;color:#dedede!important;border-color:#414141!important;
}
.btn:not(.primary):hover,.v3-btn-sage:hover,
.concept-workbench-root .button:not(.primary):hover,
#conceptOverlay .button:not(.primary):hover {background:#343434!important;color:#f5f5f5!important;border-color:#555!important;}
.btn.quiet,.btn.quiet:hover {border-color:transparent!important;}
.btn.danger,.v3-shelf-btn.danger {color:#eda9a9!important;}
.btn.danger:hover,.v3-shelf-btn.danger:hover{background:#422b2b!important;color:#ffd0d0!important;border-color:#854747!important;}
/* Inputs use a recessed but readable native-like neutral treatment. */
.input,.select,.textarea,textarea,input:not([type="checkbox"]):not([type="range"]),
select,.select-trigger,.concept-workbench-root .field,#conceptOverlay .field {
  background-color:#1d1d1d!important;border-color:#3c3c3c!important;color:#ececec!important;
}
input::placeholder,textarea::placeholder{color:#858585!important;opacity:1;}
.input:focus,.select:focus,.textarea:focus,
.concept-workbench-root .field:focus,#conceptOverlay .field:focus,
.select-trigger[aria-expanded="true"] {border-color:#868686!important;box-shadow:0 0 0 1px #77777740!important;}
.select-popover{background:#252525!important;border-color:#474747!important;}
.select-choice{white-space:nowrap!important;}
.select-choice:hover,.select-choice.selected{background:#383838!important;color:#f1f1f1!important;}
.select-choice .tick{display:inline-flex!important;align-items:center!important;}
.select-choice .tick svg{width:13px!important;height:13px!important;stroke:currentColor!important;fill:none!important;}
/* Grouping elements and workspaces: subtle outlines; no glowing cards. */
.card,.section-block,.v23-home-panel,.v25-card,.v23-stat,.v25-metric,
.v24-work-nav,.v24-work-preview,.v3-panel-box,.v3-stats-card,
.v3-entrance-card,.v3-tag-side-box,.v3-lib-shelf,.v3-weight-card,
.concept-workbench-root .panel,.concept-workbench-root .concept {
  background:#202020!important;border-color:#353535!important;box-shadow:none!important;
}
.card.click:hover,.v3-entrance-card:hover,.v24-rp-card:hover,
.concept-workbench-root .concept:hover {background:#262626!important;border-color:#525252!important;box-shadow:none!important;transform:none!important;}
.concept-workbench-root .concept.selected,
.concept-workbench-root .compact-item.selected,
.v3-tag-item.selected,.v23-index-row.on,.v24-work-item.on,
.v3-works-item.on,.v3-rp-card.selected,.choice.on,.choice.chosen {
  background:#2c2c2c!important;border-color:#919191!important;box-shadow:inset 0 0 0 1px #737373!important;
}
.chip,.v22-label,.v3-lib-capsule,.concept-workbench-root .chip,
.concept-workbench-root .branch-pill,.v3-shelf-badge,.tag-row .chip {
  background:#292929!important;border-color:#3f3f3f!important;color:#c9c9c9!important;
}
.chip.green,.chip.blue,.chip.gold,
.concept-workbench-root .chip.fixed,.concept-workbench-root .chip.new,
.concept-workbench-root .branch-pill.active {
  background:#323232!important;color:#e7e7e7!important;border-color:#575757!important;
}
.concept-workbench-root .chip.excluded{background:#3b2828!important;color:#f0aaaa!important;border-color:#6b4848!important;}
/* Remove large green branding gradients and pseudo-light glows. */
.banner,.v23-hero,.v22-hero,.v3-hero-banner,.v3-entrance-card.featured {
  background:#252525!important;border-color:#393939!important;box-shadow:none!important;
}
.v3-hero-banner::after{display:none!important;}
.v23-hero-art,.inline-logo,.v3-entrance-icon,.feature-icon,
.v3-entrance-icon,.v251-roles-initial {background:#353535!important;color:#dedede!important;border-color:#484848!important;transform:none!important;}
.v3-inspire-box,.v3-spark-box,.v25-soft-card,
.v251-mosaic-item,.v251-mosaic-item:nth-child(3n+2),.v251-mosaic-item:nth-child(3n),
.v251-trend-expansion,.v251-weekly-expansion {background:#222222!important;border-color:#3b3b3b!important;box-shadow:none!important;}
/* Data visualization uses shades of grey, preserving intensity differences. */
.v25-l0{background:#292929!important;border-color:#333!important;}
.v25-l1{background:#434343!important;border-color:#4c4c4c!important;}
.v25-l2{background:#636363!important;border-color:#747474!important;}
.v25-l3{background:#909090!important;border-color:#999!important;}
.v25-l4{background:#cacaca!important;border-color:#d4d4d4!important;}
.v25-bar,.v251-week b,.v23-bar-value,.v251-databar span,.v3-wt-pct-fill{
  background:#bebebe!important;border-color:#aaa!important;box-shadow:none!important;
}
.v25-barbtn.on .v25-bar{background:#eeeeee!important;border-color:#eeeeee!important;}
.v25-barbtn:hover .v25-bar{background:#dddddd!important;border-color:#cccccc!important;}
/* Secondary text is readable, without mint tint. */
.muted,.sub,.tiny,.v23-quiet,.v25-small,.v23-home-meta,
.concept-workbench-root .teaser,.concept-workbench-root .source-note,
.concept-workbench-root .concept-id,.v3-entrance-desc {color:#aaa!important;}
.eyebrow,.v22-eyebrow,.side-section,.v3-lib-stats,.v3-stats-head {color:#aaa!important;}
.accent,.v3-entrance-link,.v25-textlink,.v25-tiny-link,.v3-spark-head,
.concept-workbench-root .focus-name {color:#dedede!important;}
/* Float dialogs above the app, keep normal overlay affordance. */
.modal,.v22-modal,#conceptOverlay .dialog{background:#252525!important;border-color:#4a4a4a!important;box-shadow:0 18px 60px #0008!important;}
.toast{background:#303030!important;border-color:#565656!important;color:#efefef!important;}
/* Neutral form controls, controlled contrast on active state. */
.toggle:checked,input[type="checkbox"]:checked{
  background:#e2e2e2!important;border-color:#e2e2e2!important;accent-color:#ededed!important;
}
input[type="checkbox"]:checked::after{border-color:#1d1d1d!important;}
input[type="range"],.range,.v3-wt-slider{accent-color:#d8d8d8!important;}
.v3-wt-slider::-webkit-slider-thumb,input[type="range"].range::-webkit-slider-thumb{background:#e5e5e5!important;box-shadow:none!important;}
/* Optional typography cleanup that doesn't change spacing or behavior. */
.h1,.h2,.h3,.v3-hero-text h1,.v23-home-header h1{color:#f0f0f0!important;}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after {scroll-behavior:auto!important;} }

/* Fine-grained finishing: remove the original luminous toggle dots. */
.v3-tag-capsule {background:#222222!important;border-color:#383838!important;box-shadow:none!important;}
.v3-tag-capsule:hover{background:#292929!important;border-color:#515151!important;}
.v3-tag-capsule.selected{background:#303030!important;border-color:#888888!important;box-shadow:none!important;}
.v3-tag-capsule.tier-high:not(.selected){border-color:#474747!important;}
.v3-capsule-toggle input:checked + .v3-toggle-dot{background:#d5d5d5!important;box-shadow:none!important;}
.v3-capsule-toggle .v3-toggle-dot{background:#595959!important;box-shadow:none!important;}
.v3-tag-capsule.is-disabled .v3-toggle-dot{background:#424242!important;}

.v3-wt-slider::-webkit-slider-thumb:hover{box-shadow:none!important;}
.v25-day:hover,.v25-hourcell:hover{box-shadow:inset 0 0 0 1px #898989!important;}


/* ================================================================
   CODEX V3.1 · Single-surface composer & user-selectable accent
   Targeted overrides only.  Preserve all existing workspaces.
   ================================================================ */
:root{
  --ui-accent:#d1d1d1;
  --ui-action-bg:#555555;
  --ui-accent-quiet:color-mix(in srgb,var(--ui-accent) 18%,#303030);
  --ui-accent-border:color-mix(in srgb,var(--ui-accent) 64%,#444444);
}
:root[data-st-accent="violet"]{--ui-accent:#ac97f5;--ui-action-bg:#7446C8}
:root[data-st-accent="blue"]{--ui-accent:#82b4f3;--ui-action-bg:#3468B6}
:root[data-st-accent="teal"]{--ui-accent:#79c4b2;--ui-action-bg:#246B61}
:root[data-st-accent="amber"]{--ui-accent:#e1b878;--ui-action-bg:#885918}
:root[data-st-accent="rose"]{--ui-accent:#e9a0b6;--ui-action-bg:#A13F67}

/* ONE visible composer surface: the textarea remains transparent. */
.composer .composer-wrap{
  background:#303030!important;
  border:1px solid #484848!important;
  border-radius:19px;
  box-shadow:none!important;
  transition:border-color .14s ease;
}
.composer .composer-wrap:focus-within{
  border-color:var(--ui-accent-border)!important;
}
.composer .composer-wrap textarea#chatinput,
.composer .composer-wrap textarea#chatinput:focus,
.composer .composer-wrap textarea#chatinput:focus-visible{
  background:transparent!important;
  background-color:transparent!important;
  background-image:none!important;
  border:0!important;
  outline:0!important;
  box-shadow:none!important;
  border-radius:0!important;
  color:var(--ink)!important;
}
.composer .composer-foot{background:transparent!important;border:0!important;box-shadow:none!important;}

/* Navigation stays neutral across all accent presets. */

.v23-index-row.on,.v24-work-item.on,.v3-works-item.on,

/* Refined 01: Secondary filter pills use neutral dark state, reserving accent exclusively for primary CTA */

.concept-workbench-root .preset.active,
.concept-workbench-root .filterbtn.active,

select:focus-visible,[role="button"]:focus-visible,
.concept-workbench-root button:focus-visible,
.concept-workbench-root .concept:focus-visible{
  outline:2px solid var(--ui-accent)!important;
  outline-offset:2px;
}
.input:focus,.select:focus,.textarea:focus,
.concept-workbench-root .field:focus,
#conceptOverlay .field:focus,.select-trigger[aria-expanded="true"]{
  border-color:var(--ui-accent-border)!important;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ui-accent) 26%,transparent)!important;
}
.toggle:checked,input[type="checkbox"]:checked{
  background:var(--ui-accent)!important;
  border-color:var(--ui-accent)!important;
  accent-color:var(--ui-accent)!important;
}

}
.v3-wt-slider::-webkit-slider-thumb,

}
.v3-capsule-toggle input:checked + .v3-toggle-dot{

}
.v25-barbtn.on .v25-bar{

}

}

/* Settings / Accent picker: native-like compact radio cards. */
.accent-settings{margin:17px 0 18px;padding:16px;border:1px solid #414141;border-radius:12px;background:#202020;}
.accent-settings-header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.accent-settings-header h3{font-size:14px;font-weight:650;margin:0;color:#eeeeee;}
.accent-settings-saved{font-size:11px;color:#a5a5a5;}
.accent-settings-note{font-size:11px;color:#b2b2b2;margin:0 0 13px;line-height:1.65;}
.accent-presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.accent-preset{
  display:flex;align-items:center;gap:9px;text-align:left;min-width:0;min-height:46px;
  padding:9px 10px;border:1px solid #404040;border-radius:9px;
  background:#292929;color:#d7d7d7;font-size:12px;
  transition:background .12s ease,border-color .12s ease;
}
.accent-preset:hover{background:#343434;border-color:#606060;}
.accent-preset[aria-pressed="true"]{
  background:#343434;border-color:var(--ui-accent-border);
  box-shadow:inset 0 0 0 1px var(--ui-accent-border);
  color:#f6f6f6;
}
.accent-swatch{width:19px;height:19px;border-radius:50%;background:var(--swatch);border:1px solid #ffffff33;flex-shrink:0;}
.accent-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.accent-check{font-size:15px;font-weight:700;opacity:0;color:var(--ui-accent);}
.accent-preset[aria-pressed="true"] .accent-check{opacity:1;}
.accent-settings-caption{color:#a8a8a8;font-size:10.5px;margin-top:11px;line-height:1.6;}
.accent-settings-subheading{font-size:12px;font-weight:650;color:#eee;margin:14px 0 6px;}
@media(max-width:550px){.accent-presets{grid-template-columns:repeat(2,minmax(0,1fr))}.accent-settings{padding:12px;}}


/* V3.2: quiet single-surface chat controls and contrast-safe accent send actions. */

  width: 6px !important;

/* ========================================================
   Codex Standard Compact Checkbox (Tag Library & Inspector)
   ======================================================== */
.tag-status-checkbox,
input[type="checkbox"].tag-status-checkbox {
  appearance: none !important;
  -webkit-appearance: none !important;
  width: 16px !important;
  height: 16px !important;
  min-width: 16px !important;
  min-height: 16px !important;
  max-width: 16px !important;
  max-height: 16px !important;
  box-sizing: border-box !important;
  background: #202020 !important;
  border: 1px solid #484848 !important;
  border-radius: 4px !important;
  outline: none !important;
  cursor: pointer !important;
  position: relative !important;
  vertical-align: middle !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  margin: 0 !important;
  padding: 0 !important;
  flex-shrink: 0 !important;
  transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease !important;
  box-shadow: none !important;
}

.tag-status-checkbox:hover,
input[type="checkbox"].tag-status-checkbox:hover {
  border-color: #707070 !important;
  background: #292929 !important;
}

/* Strictly neutralize and remove ANY pseudo ::before (kills floating sliding knobs) */
.tag-status-checkbox::before,
.tag-status-checkbox:before,
input[type="checkbox"].tag-status-checkbox::before,
input[type="checkbox"].tag-status-checkbox:before,
.tag-item .toggle::before,
.tag-item .toggle:before,
.v3-tag-row .toggle::before,
.v3-tag-row .toggle:before,
.v3-tag-inspector .toggle::before,
.v3-tag-inspector .toggle:before {
  display: none !important;
  content: none !important;
  width: 0 !important;
  height: 0 !important;
  opacity: 0 !important;
  visibility: hidden !important;
  transform: none !important;
}

/* Checked State: Dynamic accent color linkage, solid background matching primary buttons */
.tag-status-checkbox:checked,
input[type="checkbox"].tag-status-checkbox:checked {
  background: var(--ui-action-bg, var(--ui-accent, #7446C8)) !important;
  border-color: var(--ui-action-bg, var(--ui-accent, #7446C8)) !important;
}

.tag-status-checkbox:checked:hover,
input[type="checkbox"].tag-status-checkbox:checked:hover {
  filter: brightness(1.08) !important;
}

/* Pure White Centered Checkmark */
.tag-status-checkbox:checked::after,
.tag-status-checkbox:checked:after,
input[type="checkbox"].tag-status-checkbox:checked::after,
input[type="checkbox"].tag-status-checkbox:checked:after {
  content: '' !important;
  position: absolute !important;
  left: 4.5px !important;
  top: 1.5px !important;
  width: 4px !important;
  height: 8px !important;
  border: solid #ffffff !important;
  border-width: 0 2px 2px 0 !important;
  transform: rotate(45deg) !important;
  display: block !important;
  box-sizing: border-box !important;
}

/* Unchecked State: absolutely no checkmark */
.tag-status-checkbox:not(:checked)::after,
.tag-status-checkbox:not(:checked):after,
input[type="checkbox"].tag-status-checkbox:not(:checked)::after,
input[type="checkbox"].tag-status-checkbox:not(:checked):after {
  display: none !important;
  content: none !important;
}

/* Keyboard Accessible Focus Ring */
.tag-status-checkbox:focus-visible,
input[type="checkbox"].tag-status-checkbox:focus-visible {
  outline: 2px solid var(--ui-accent, #7c3aed) !important;
  outline-offset: 1px !important;
}

  /* API Connection Model Discovery & Key Wrap */
  .key-input-wrap {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
  }
  .key-input-wrap .input {
    width: 100% !important;
    padding-right: 38px !important;
    box-sizing: border-box !important;
  }
  .icon-ghost-btn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: #888888;
    cursor: pointer;
    padding: 5px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.12s ease, background 0.12s ease;
    z-index: 2;
  }
  .icon-ghost-btn:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.08);
  }
  .icon-ghost-btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .endpoint-preview-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    background: #1e1e1e;
    border: 1px solid #323232;
    border-radius: 6px;
    padding: 5px 10px;
    margin-top: 4px;
  }
  .endpoint-preview-tag {
    font-size: 10px;
    text-transform: uppercase;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    background: #2a2a2a;
    color: #b0b0b0;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .endpoint-preview-url {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 11px;
    color: #929292;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .model-hub-card {
    background: #202020;
    border: 1px solid #363636;
    border-radius: 11px;
    padding: 13px 15px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    margin-top: 6px;
    box-sizing: border-box;
  }
  .model-hub-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .model-hub-title {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .model-hub-title strong {
    font-size: 12.5px;
    font-weight: 650;
    color: #fff;
  }
  .model-count-badge {
    font-size: 11px;
    background: #282828;
    border: 1px solid #3d3d3d;
    color: #c9c9c9;
    padding: 2px 7px;
    border-radius: 6px;
  }
  .model-hub-actions {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .attached-chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 28px;
    align-items: center;
  }
  .model-chip {
    background: #282828;
    border: 1px solid #3d3d3d;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #e0e0e0;
  }
  .model-chip .chip-del {
    color: #888;
    cursor: pointer;
    display: grid;
    place-items: center;
    border-radius: 3px;
    font-size: 13px;
    line-height: 1;
  }
  .model-chip .chip-del:hover {
    color: #f87171;
  }
  .discovery-tray {
    background: #1a1a1a;
    border: 1px solid #3a3a3a;
    border-radius: 9px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
    animation: tray-open 0.16s ease-out;
  }
  @keyframes tray-open {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tray-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tray-headline {
    font-size: 12px;
    color: #dcdcdc;
    font-weight: 500;
  }
  .tray-headline b, .tray-headline span {
    color: #ffffff;
    font-weight: 650;
  }
  .tray-toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .tray-search-wrap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
  }
  .tray-search-wrap .search-icon {
    position: absolute;
    left: 9px;
    width: 14px;
    height: 14px;
    color: #909090;
    pointer-events: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tray-search {
    width: 100%;
    height: 31px;
    background: #232323;
    border: 1px solid #3c3c3c;
    border-radius: 6px;
    padding: 0 10px 0 29px;
    font-size: 11.5px;
    color: #fff;
    outline: none;
    transition: border-color 0.12s ease;
    box-sizing: border-box;
  }
  .tray-search:focus {
    border-color: #666;
  }
  .tray-status-tabs {
    display: inline-flex;
    background: #242424;
    border: 1px solid #383838;
    border-radius: 6px;
    padding: 2px;
    gap: 2px;
  }
  .tray-tab {
    background: transparent;
    border: none;
    color: var(--muted, #bfbfbf);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .tray-tab:hover {
    color: #fff;
  }
  .tray-tab.active {
    background: #363636;
    color: #fff;
    font-weight: 600;
  }
  .discovery-list {
    max-height: 210px;
    overflow-y: auto;
    border: 1px solid #2e2e2e;
    border-radius: 7px;
    background: #171717;
    display: flex;
    flex-direction: column;
    scrollbar-width: thin;
    scrollbar-color: #3f3f3f transparent;
  }
  .model-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 11px;
    border-bottom: 1px solid #242424;
    cursor: pointer;
    user-select: none;
    transition: background 0.1s ease;
  }
  .model-row:last-child {
    border-bottom: none;
  }
  .model-row:hover {
    background: #222222;
  }
  .model-row.is-attached {
    opacity: 0.6;
  }
  .model-row.is-attached:hover {
    background: #1c1c1c;
  }
  .model-row-left {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    flex: 1;
  }
  .model-checkbox {
    width: 15px;
    height: 15px;
    accent-color: var(--accent, #ac97f5);
    cursor: pointer;
    flex-shrink: 0;
  }
  .model-name-id {
    font-size: 12px;
    font-weight: 600;
    color: #eee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .model-row-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .status-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 550;
  }
  .status-tag.new {
    background: #2a2a2a;
    color: #e2e2e2;
    border: 1px solid #444444;
  }
  .status-tag.attached {
    background: #232323;
    color: #888888;
    border: 1px solid #333333;
  }
  .tray-footbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 6px;
    border-top: 1px solid #2a2a2a;
    flex-wrap: wrap;
    gap: 8px;
  }
  .select-counter {
    font-size: 11px;
    color: var(--muted, #bfbfbf);
  }
  .tray-buttons-group {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .notice-card {
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.35);
    border-radius: 8px;
    padding: 9px 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    color: #fca5a5;
    font-size: 11.5px;
  }
  .notice-card svg {
    flex-shrink: 0;
    margin-top: 2px;
    width: 15px;
    height: 15px;
    stroke: currentColor;
  }
  .spinner {
    width: 13px;
    height: 13px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: inline-block;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Global Fixed Toast Notification (Prevents window vertical scrollbar glitch) */
  #toast {
    position: fixed !important;
    bottom: 24px !important;
    right: 24px !important;
    background: rgba(28, 28, 28, 0.96) !important;
    color: #f5f5f5 !important;
    border: 1px solid #484848 !important;
    border-radius: 8px !important;
    padding: 10px 16px !important;
    font-size: 12px !important;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7) !important;
    backdrop-filter: blur(8px) !important;
    z-index: 99999 !important;
    display: none;
    pointer-events: none;
    max-width: 380px;
    line-height: 1.5;
  }

  /* Service Connection Modal: Single Scroll Surface & Prevent Double Scrollbars */
  .modal.modal-edit-connection-dialog {
    display: flex !important;
    flex-direction: column !important;
    overflow: hidden !important;
    max-height: min(84vh, 700px) !important;
    padding: 0 !important;
  }
  .modal.modal-edit-connection-dialog .modal-head {
    padding: 18px 24px 14px !important;
    border-bottom: 1px solid #383838 !important;
    flex-shrink: 0 !important;
    margin-bottom: 0 !important;
  }
  .modal.modal-edit-connection-dialog .scroll {
    flex: 1 1 auto !important;
    min-height: 0 !important;
    max-height: none !important;
    overflow-y: auto !important;
    padding: 16px 24px !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 13px !important;
    scrollbar-width: thin !important;
    scrollbar-color: rgba(255, 255, 255, 0.25) transparent !important;
  }
  .modal.modal-edit-connection-dialog .scroll > * {
    flex-shrink: 0 !important; /* CRITICAL: Prevent flex children from squishing when expanded */
  }
  .modal.modal-edit-connection-dialog .scroll::-webkit-scrollbar {
    width: 6px !important;
  }
  .modal.modal-edit-connection-dialog .scroll::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.22) !important;
    border-radius: 4px !important;
  }
  .modal.modal-edit-connection-dialog .scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.42) !important;
  }
  .modal.modal-edit-connection-dialog .scroll::-webkit-scrollbar-track {
    background: transparent !important;
  }
  .modal.modal-edit-connection-dialog .modal-footer {
    padding: 14px 24px !important;
    border-top: 1px solid #383838 !important;
    background: #202020 !important;
    margin-top: 0 !important;
    flex-shrink: 0 !important;
  }

  /* Sub-pixel Inset Focus Ring Without Edge Clipping */
  .key-input-wrap .input:focus,
  .key-input-wrap .input:focus-visible,
  .modal.modal-edit-connection-dialog input.input:focus,
  .modal.modal-edit-connection-dialog input.input:focus-visible {
    outline: none !important;
    border-color: #888888 !important;
    box-shadow: 0 0 0 1px #888888, 0 0 0 3px rgba(255, 255, 255, 0.08) !important;
  }

  /* Manage Models Dialog: Clean Desktop Single Scroll Surface & Card Stream */
  .modal.modal-manage-models-dialog {
    display: flex !important;
    flex-direction: column !important;
    overflow: hidden !important;
    max-height: min(84vh, 660px) !important;
    padding: 0 !important;
    width: min(640px, 92vw) !important;
  }
  .modal.modal-manage-models-dialog .modal-head {
    padding: 16px 24px !important;
    border-bottom: 1px solid #383838 !important;
    flex-shrink: 0 !important;
    margin-bottom: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
  }
  .modal.modal-manage-models-dialog .modal-head h3,
  .modal.modal-manage-models-dialog .modal-head h2 {
    font-size: 15px !important;
    font-weight: 650 !important;
    color: #fff !important;
    margin: 0 !important;
  }
  .modal.modal-manage-models-dialog .scroll {
    flex: 1 1 auto !important;
    min-height: 0 !important;
    max-height: none !important;
    overflow-y: auto !important;
    padding: 16px 24px !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 12px !important;
    scrollbar-width: thin !important;
    scrollbar-color: rgba(255, 255, 255, 0.25) transparent !important;
  }
  .modal.modal-manage-models-dialog .scroll > * {
    flex-shrink: 0 !important;
  }
  .modal.modal-manage-models-dialog .scroll::-webkit-scrollbar {
    width: 6px !important;
  }
  .modal.modal-manage-models-dialog .scroll::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.22) !important;
    border-radius: 4px !important;
  }
  .modal.modal-manage-models-dialog .scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.42) !important;
  }
  .modal.modal-manage-models-dialog .scroll::-webkit-scrollbar-track {
    background: transparent !important;
  }
  .modal.modal-manage-models-dialog .modal-footer {
    padding: 14px 24px !important;
    border-top: 1px solid #383838 !important;
    background: #202020 !important;
    margin-top: 0 !important;
    flex-shrink: 0 !important;
  }

  /* Control Row: Search Input + Borderless Sync Action Outside */
  .model-manage-control-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }
  .model-search-box {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 9px;
    background: #1c1c1c;
    border: 1px solid #383838;
    border-radius: 8px;
    padding: 8px 12px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .model-search-box:focus-within {
    border-color: #777;
    box-shadow: 0 0 0 1px #888, 0 0 0 3px rgba(255, 255, 255, 0.06);
  }
  .model-search-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 12.5px;
    outline: none;
    font-family: inherit;
  }
  .model-search-input::placeholder { color: #666; }

  /* Borderless sync icon button on the right */
  .model-sync-icon-btn {
    background: transparent !important;
    border: none !important;
    color: #8c8c8c !important;
    cursor: pointer;
    padding: 8px !important;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.14s ease;
    flex-shrink: 0;
  }
  .model-sync-icon-btn:hover {
    color: #fff !important;
    background: rgba(255, 255, 255, 0.08) !important;
  }
  .model-sync-icon-btn:active {
    transform: scale(0.92);
  }
  .model-sync-icon-btn.spin-icon svg,
  .model-sync-icon-btn.spin-icon {
    animation: modelSyncSpin 0.7s linear infinite;
  }
  @keyframes modelSyncSpin { 100% { transform: rotate(360deg); } }
